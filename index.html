<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=LXGW+WenKai+TC:wght@300;400&family=Zhi+Mang+Xing&family=Long+Cang&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #fbf8f3;
  --paper: #fffdf9;
  --paper-r: #fdfaf4;
  --ink: #4a4754;
  --ink-soft: #918d9c;
  --ink-faint: #bbb6c4;
  --line: rgba(80,75,95,0.08);
  --line-strong: rgba(80,75,95,0.14);
  --spine: rgba(80,75,95,0.12);

  --accent:#f29db1; --accent-deep:#dd7393;

  --display:'Quicksand',sans-serif;
  --hand:'Long Cang','LXGW WenKai TC',cursive;
  --hand2:'Zhi Mang Xing',cursive;
  --zh:'LXGW WenKai TC','Noto Sans SC',sans-serif;
  --sans:'Quicksand','LXGW WenKai TC',sans-serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.7; min-height:100vh; padding:40px 22px 96px;
  display:flex; justify-content:center; -webkit-font-smoothing:antialiased;
}
.zh{font-family:var(--zh);}
.wrap{ width:100%; max-width:1120px; }

/* sign-in / loading / save dot */
.signin-screen{ min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; animation:fadeIn 0.6s ease-out; }
.signin-logo{ opacity:0.95; }
.signin-title{ font-family:var(--hand); font-size:52px; color:var(--ink); line-height:1; }
.signin-sub{ font-family:var(--zh); font-size:14px; color:var(--ink-soft); letter-spacing:0.1em; margin-bottom:8px; }
.signin-btn{ font-family:var(--zh); font-size:14px; background:#fff; color:var(--ink); border:1px solid var(--line-strong);
  padding:11px 22px; border-radius:999px; cursor:pointer; display:inline-flex; align-items:center; gap:10px; transition:all 0.2s; box-shadow:0 2px 10px rgba(120,110,140,0.08); }
.signin-btn:hover{ box-shadow:0 4px 16px rgba(120,110,140,0.15); transform:translateY(-1px); }
.loading-screen{ min-height:80vh; display:flex; align-items:center; justify-content:center; }
.loading-dots{ font-family:var(--display); font-size:26px; color:var(--ink-faint); letter-spacing:0.3em; animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:0.4;} 50%{opacity:1;} }
.savedot{ position:fixed; top:14px; right:14px; width:7px; height:7px; border-radius:50%; background:var(--ink-faint); opacity:0; transition:opacity 0.4s,background 0.2s,transform 0.25s; z-index:400; pointer-events:none; }
.savedot.saving{ opacity:0.5; animation:pulse 1.4s ease-in-out infinite; }
.savedot.saved{ opacity:0.8; background:#a8d3a0; transform:scale(1.4); }
.savedot.error{ opacity:0.9; background:#dd7393; width:9px; height:9px; }
.blob{ position:fixed; border-radius:50%; filter:blur(70px); opacity:0.34; z-index:-1; pointer-events:none; }
.b1{width:340px;height:340px;background:#f9d3dd;top:-90px;right:-50px;}
.b2{width:300px;height:300px;background:#d3e6f9;bottom:30px;left:-90px;}
.b3{width:260px;height:260px;background:#e0f3d6;top:45%;right:-80px;}

.book{ display:flex; background:var(--paper); border-radius:22px; overflow:hidden;
  box-shadow:0 10px 50px rgba(120,110,140,0.13), 0 2px 8px rgba(120,110,140,0.06);
  border:1px solid var(--line); min-height:640px; }
.page{ flex:1; min-width:0; padding:36px 36px 30px; position:relative; }
.page-left{ border-right:1px solid var(--spine); position:relative; }
.page-left::before{ content:''; position:absolute; inset:0; background-image:var(--diary-bg);
  background-size:cover; background-position:center; opacity:0.16; pointer-events:none; z-index:0; }
.page-left > *{ position:relative; z-index:1; }
.page-right{ background:var(--paper-r); position:relative; }
.page-right::before{ content:''; position:absolute; inset:0; background-image:var(--diary-bg);
  background-size:cover; background-position:center; opacity:0.42; pointer-events:none; }

.brand{ font-family:var(--hand); font-size:46px; color:var(--ink); display:flex; align-items:center; gap:12px; line-height:1; }
.brand .logo{ width:38px; height:38px; flex-shrink:0; }
.brand-sub{ font-family:var(--zh); font-size:13.5px; color:var(--ink-soft); margin-top:9px; letter-spacing:0.04em; }

.datebar{ display:flex; align-items:center; gap:6px; margin-top:20px; margin-bottom:6px; }
.darr{ font-family:var(--display); font-weight:600; font-size:19px; color:var(--ink-faint); cursor:pointer;
  padding:3px 9px; user-select:none; transition:all 0.2s; border-radius:9px; line-height:1; }
.darr:hover{ color:var(--accent-deep); background:#fdeef2; }
.dlabel{ flex:1; text-align:center; font-family:var(--display); font-weight:600; font-size:16px; cursor:pointer; border-radius:8px; padding:3px 6px; transition:background 0.18s; }
.dlabel:hover{ background:#fdeef2; }

/* calendar popup */
.cal-pop{ position:fixed; z-index:260; width:280px; background:var(--paper); border:1px solid var(--line-strong); border-radius:14px; padding:14px; box-shadow:0 10px 36px rgba(120,110,140,0.2); animation:din 0.18s cubic-bezier(0.16,1,0.3,1); }
.cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.cal-title{ font-family:var(--zh); font-size:14px; color:var(--ink); font-weight:500; }
.cal-nav{ font-family:var(--display); font-weight:600; font-size:18px; color:var(--ink-faint); cursor:pointer; padding:2px 10px; border-radius:8px; transition:all 0.15s; }
.cal-nav:hover{ color:var(--accent-deep); background:#fdeef2; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.cal-wd{ font-family:var(--zh); font-size:10px; color:var(--ink-faint); text-align:center; padding:4px 0; }
.cal-cell{ position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-size:12.5px; color:var(--ink); cursor:pointer; border-radius:8px; transition:background 0.12s; }
.cal-cell.empty{ cursor:default; }
.cal-cell:not(.empty):hover{ background:#fdeef2; }
.cal-cell.today{ font-weight:700; color:var(--accent-deep); }
.cal-cell.view{ background:var(--accent); color:#fff; }
.cal-cell.view:hover{ background:var(--accent-deep); }
.cal-dot{ position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--accent); }
.cal-cell.view .cal-dot{ background:#fff; }
.cal-foot{ margin-top:10px; text-align:center; }
.cal-today-btn{ font-family:var(--zh); font-size:11.5px; color:var(--accent-deep); cursor:pointer; padding:4px 12px; border-radius:999px; transition:background 0.15s; }
.cal-today-btn:hover{ background:#fdeef2; }
.dlabel .wd{ font-family:var(--zh); font-size:12.5px; color:var(--ink-soft); font-weight:400; margin-left:6px; }
.dlabel .rel{ display:inline-block; font-family:var(--display); font-size:9.5px; font-weight:600; letter-spacing:0.06em;
  text-transform:uppercase; color:#fff; background:var(--accent); border-radius:999px; padding:1px 7px; margin-left:7px; vertical-align:middle; }
.dlabel .rel.future{ background:#94b8e0; } .dlabel .rel.past{ background:var(--ink-faint); }
.djump{ font-family:var(--zh); font-size:11.5px; color:var(--accent-deep); cursor:pointer; padding:4px 8px; border-radius:9px; white-space:nowrap; transition:background 0.2s; }
.djump:hover{ background:#fdeef2; }

.mood{ margin:18px 0 4px; padding:13px 16px; background:rgba(255,255,255,0.7); border:1px solid var(--line); border-radius:13px; }
.mood-title{ font-family:var(--zh); font-size:12px; color:var(--ink-soft); margin-bottom:9px; }
.mood-sliders{ display:flex; flex-direction:column; gap:9px; }
.mslot{ display:flex; align-items:center; gap:11px; }
.mslot .t{ font-family:var(--zh); font-size:12.5px; color:var(--ink-soft); width:16px; flex-shrink:0; }
.mtrack{ flex:1; height:14px; border-radius:999px; position:relative; cursor:pointer;
  background:linear-gradient(90deg,#f6c98a 0%,#f4b08a 18%,#f3a8b8 38%,#e2b0d0 55%,#bdb4dd 72%,#9fc4dd 88%,#a8cdd0 100%);
  box-shadow:inset 0 1px 3px rgba(80,75,95,0.12); }
.mtrack.unset{ background:rgba(80,75,95,0.07); box-shadow:none; }
.mtrack.unset .mknob{ display:none; }
.mfill{ display:none; }
.mknob{ position:absolute; top:50%; width:20px; height:20px; border-radius:50%; background:#fff;
  border:2px solid rgba(255,255,255,0.9); box-shadow:0 1px 5px rgba(80,75,95,0.3); transform:translate(-50%,-50%);
  transition:left 0.12s, background 0.12s; pointer-events:none; }
.mtrack.unset::after{ content:'点一下，记心情'; position:absolute; left:12px; top:50%; transform:translateY(-50%);
  font-family:var(--zh); font-size:10.5px; color:var(--ink-faint); pointer-events:none; }
.mhint{ font-family:var(--zh); font-size:10px; color:var(--ink-faint); margin-top:8px; display:flex; justify-content:space-between; }

.sec{ margin-top:22px; }
.sec-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
.sec-title{ font-family:var(--zh); font-size:17px; color:var(--ink); flex-shrink:0; }
.sec-note{ font-family:var(--zh); font-size:12.5px; color:var(--ink-faint); flex-shrink:0; }
.sec-line{ flex:1; height:1px; background:var(--line); align-self:center; }
.pool-head{ cursor:pointer; user-select:none; border-radius:8px; margin-left:-6px; padding-left:6px; transition:background 0.15s; }
.pool-head:hover{ background:rgba(242,157,177,0.06); }
.pool-caret{ font-family:var(--display); font-size:11px; color:var(--ink-faint); transition:transform 0.2s; display:inline-block; margin-right:2px; }
.pool-head:hover .pool-caret{ color:var(--accent-deep); }
.sec-tool{ font-family:var(--zh); font-size:11px; color:var(--ink-faint); cursor:pointer; padding:2px 9px; border-radius:999px; border:1px solid var(--line-strong); flex-shrink:0; transition:all 0.15s; margin-left:4px; }
.sec-tool:hover{ color:var(--accent-deep); border-color:var(--accent); }
.sel-box{ width:18px; height:18px; border-radius:5px; border:1.5px solid var(--ink-faint); flex-shrink:0; margin-top:2px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.18s; }
.sel-box:hover{ border-color:var(--accent); }
.sel-box.on{ background:var(--accent); border-color:var(--accent); }
.sel-box.on::after{ content:''; width:5px; height:8px; border:solid #fff; border-width:0 1.5px 1.5px 0; transform:rotate(45deg) translateY(-1px); }
.sel-box.disabled{ opacity:0.25; cursor:default; border-style:dashed; }
.sel-box.disabled:hover{ border-color:var(--ink-faint); }
.batch-bar{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); border-radius:999px; padding:8px 8px 8px 18px; display:flex; align-items:center; gap:8px; box-shadow:0 8px 30px rgba(0,0,0,0.2); z-index:280; animation:tin 0.3s cubic-bezier(0.16,1,0.3,1); max-width:calc(100vw - 24px); }
.bb-count{ font-size:12.5px; opacity:0.9; white-space:nowrap; }
.bb-btn,.bb-cancel{ font-family:var(--zh); font-size:12px; color:var(--bg); background:rgba(251,248,243,0.16); border:none; cursor:pointer; padding:7px 13px; border-radius:999px; transition:background 0.15s; }
.bb-btn:hover,.bb-cancel:hover{ background:rgba(251,248,243,0.28); }
.bb-move{ font-family:var(--zh); font-size:12.5px; color:var(--ink); background:var(--bg); border:none; cursor:pointer; padding:7px 15px; border-radius:999px; font-weight:500; transition:opacity 0.15s; white-space:nowrap; }
.bb-move:hover{ opacity:0.85; }

.entries{ display:flex; flex-direction:column; gap:6px; }
.entry{ display:flex; align-items:flex-start; gap:9px; padding:9px 11px; background:rgba(255,255,255,0.78);
  border-radius:12px; border:1px solid var(--line); transition:all 0.22s; }
.entry:hover{ box-shadow:0 2px 12px rgba(120,110,140,0.07); }
.entry.adding{ animation:pop 0.34s cubic-bezier(0.16,1,0.3,1); }
@keyframes pop{ from{opacity:0;transform:translateY(-6px) scale(0.97);} to{opacity:1;transform:none;} }
.entry.leaving{ animation:leave 0.24s ease-in forwards; }
@keyframes leave{ to{opacity:0;transform:translateX(12px);height:0;padding:0 11px;margin:0;border-color:transparent;} }
.entry.done{ opacity:0.5; }
.grip{ width:16px; flex-shrink:0; cursor:grab; color:var(--ink-faint); opacity:0; font-size:11px; line-height:1; letter-spacing:-2px; user-select:none; touch-action:none; margin-top:3px; display:flex; align-items:center; justify-content:center; transition:opacity 0.15s; }
.entry:hover .grip{ opacity:0.45; }
.grip:hover{ opacity:1 !important; color:var(--accent-deep); }
.grip:active{ cursor:grabbing; }
.ggrip{ cursor:grab; color:var(--ink-faint); opacity:0.4; font-size:10px; letter-spacing:-2px; user-select:none; touch-action:none; padding:0 4px 0 0; transition:opacity 0.15s; }
.ggrip:hover{ opacity:1; color:var(--accent-deep); }
.ggrip:active{ cursor:grabbing; }
body.dragging{ cursor:grabbing; user-select:none; }
.entry.dragging-src{ opacity:0.3; }
.group-cluster.dragging-src{ opacity:0.4; }
.drag-ghost{ position:fixed; pointer-events:none; z-index:1000; background:var(--paper); border:1px solid var(--line-strong); border-radius:9px; padding:7px 13px; font-size:14px; color:var(--ink); box-shadow:0 4px 18px rgba(120,110,140,0.22); max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.drop-line{ height:0; border-top:2px solid var(--accent); margin:-1px 0; border-radius:2px; animation:fadeIn 0.2s; }
.drop-zone-hot{ background:rgba(242,157,177,0.05); border-radius:12px; }
.echeck{ width:19px; height:19px; border-radius:50%; border:1.5px solid var(--ink-faint); cursor:pointer;
  flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center; background:transparent; transition:all 0.2s; }
.echeck:hover{ border-color:var(--accent); }
.echeck.on{ background:var(--accent); border-color:var(--accent); }
.echeck.on::after{ content:''; width:5px; height:8px; border:solid #fff; border-width:0 1.5px 1.5px 0; transform:rotate(45deg) translateY(-1px); }
.emain{ flex:1; min-width:0; }
.etext{ font-family:var(--zh); font-size:15px; color:var(--ink); word-break:break-word; cursor:text; }
.etext-wrap{ display:flex; flex-direction:column; gap:2px; }
.edetail{ font-family:var(--zh); font-size:13px; color:var(--ink-soft); word-break:break-word; cursor:text; padding-left:14px; position:relative; line-height:1.5; }
.edetail::before{ content:'•'; position:absolute; left:2px; color:var(--ink-faint); }
.entry.done .edetail{ color:var(--ink-faint); }
.etext-edit{ font-family:var(--zh); font-size:15px; color:var(--ink); width:100%; border:none; border-bottom:1px solid var(--accent); background:transparent; outline:none; resize:none; overflow:hidden; line-height:1.5; padding:2px 0; }
.etags{ display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.tchip{ font-family:var(--zh); font-size:11px; padding:2px 9px; border-radius:999px; color:#fff; user-select:none; cursor:grab; touch-action:none; display:inline-flex; align-items:center; gap:0; }
.tchip:active{ cursor:grabbing; }
.tchip.chip-src{ opacity:0.3; }
.tchip-x{ display:inline-flex; align-items:center; justify-content:center; width:0; overflow:hidden; opacity:0; font-size:13px; line-height:1; cursor:pointer; transition:width 0.15s, opacity 0.15s, margin 0.15s; margin-left:0; }
.tchip:hover .tchip-x{ width:13px; opacity:0.8; margin-left:4px; margin-right:-2px; }
.tchip-x:hover{ opacity:1; }
.topt{ cursor:grab; }
.topt.chip-src{ opacity:0.3; }
.chip-drop{ display:inline-block; width:2px; height:16px; background:var(--accent); border-radius:2px; vertical-align:middle; margin:0 1px; animation:fadeIn 0.15s; }
.eact{ display:flex; gap:1px; opacity:0; transition:opacity 0.18s; }
.entry:hover .eact{ opacity:1; }
.mbtn{ width:25px; height:25px; border-radius:8px; border:none; background:transparent; color:var(--ink-faint);
  cursor:pointer; font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
.mbtn:hover{ background:#fdeef2; color:var(--accent-deep); }
.empty{ font-family:var(--zh); font-size:13.5px; color:var(--ink-faint); padding:8px 4px; }

/* done fold */
.done-fold{ font-family:var(--zh); font-size:12.5px; color:var(--ink-faint); cursor:pointer; padding:8px 4px 4px; user-select:none; display:flex; align-items:center; gap:6px; transition:color 0.2s; }
.done-fold:hover{ color:var(--accent-deep); }
.done-fold .caret{ display:inline-block; transition:transform 0.2s; font-size:10px; }
.done-fold.open .caret{ transform:rotate(90deg); }
.done-wrap{ display:flex; flex-direction:column; gap:6px; margin-top:4px; }

/* group cluster */
.group-cluster{ margin:10px 0; border-left:3px solid var(--line-strong); padding:4px 10px 8px 11px; border-radius:10px; transition:background 0.2s; }
.group-head{ display:flex; align-items:center; gap:6px; padding:5px 2px 8px; cursor:pointer; user-select:none; }
.group-head .gcaret{ font-size:10px; }
.group-head .gname{ font-size:13.5px; font-weight:600; letter-spacing:0.01em; }
.group-head .gcount{ font-family:var(--display); font-size:10.5px; font-weight:600; color:#fff; border-radius:999px; padding:0 7px; }
.group-head .gmove{ margin-left:auto; cursor:pointer; font-size:13px; padding:0 5px; opacity:0; transition:opacity 0.18s; font-weight:700; }
.group-head .gedit{ cursor:pointer; font-size:15px; padding:0 5px; opacity:0; transition:opacity 0.18s; }
.group-cluster:hover .gedit, .group-cluster:hover .gmove{ opacity:0.7; }
.group-head .gedit:hover, .group-head .gmove:hover{ opacity:1 !important; }
.group-body{ display:flex; flex-direction:column; gap:6px; }
.group-add{ margin-top:4px; padding-top:4px; }
.group-add-btn{ font-family:var(--zh); font-size:12px; background:none; border:none; cursor:pointer; padding:3px 6px; border-radius:6px; opacity:0; transition:opacity 0.18s, background 0.15s; }
.group-cluster:hover .group-add-btn{ opacity:0.65; }
.group-add-btn:hover{ opacity:1; background:rgba(255,255,255,0.5); }
.group-add-input{ font-family:var(--zh); font-size:14px; color:var(--ink); background:transparent; border:none; border-bottom:1px solid; outline:none; padding:3px 2px; width:90%; }
.group-cluster .entry{ background:rgba(255,255,255,0.55); }
.gsw-grid{ display:grid; grid-template-columns:repeat(8,1fr); gap:8px; margin-bottom:18px; }
.gsw{ width:26px; height:26px; border-radius:50%; cursor:pointer; transition:transform 0.12s; }
.gsw:hover{ transform:scale(1.15); }

.gpick-opt{ font-family:var(--zh); font-size:12px; padding:4px 11px; border-radius:999px; cursor:pointer; border:1.5px solid var(--line-strong); color:var(--ink-soft); background:transparent; transition:all 0.15s; }
.gpick-opt:hover{ border-color:var(--accent); color:var(--accent-deep); }

.addzone{ margin-top:8px; }
.add-row{ display:flex; align-items:center; gap:7px; background:rgba(255,255,255,0.7); border:1.5px solid var(--accent); border-radius:12px; padding:3px 3px 3px 13px; }
.add-in{ flex:1; border:none; background:transparent; outline:none; font-family:var(--zh); font-size:14.5px; color:var(--ink); padding:8px 0; }
.add-in::placeholder{ color:var(--ink-faint); }
.add-go{ border:none; background:var(--accent); color:#fff; cursor:pointer; width:33px; height:33px; border-radius:10px; font-size:17px; line-height:1; transition:all 0.12s; }
.add-go:hover{ background:var(--accent-deep); } .add-go:active{ transform:scale(0.93); }
.add-trig{ font-family:var(--zh); font-size:13px; color:var(--ink-soft); cursor:pointer; padding:9px 13px; border:1.5px dashed var(--line-strong); border-radius:12px; background:transparent; width:100%; text-align:left; transition:all 0.18s; }
.add-trig:hover{ border-color:var(--accent); color:var(--accent-deep); background:rgba(255,255,255,0.5); }

.tagpick{ display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; padding:0 2px; align-items:center; }
.topt{ font-family:var(--zh); font-size:11.5px; padding:3px 11px; border-radius:999px; cursor:pointer; border:1.5px solid; background:transparent; user-select:none; transition:all 0.15s; }
.topt-add{ font-family:var(--zh); font-size:11.5px; padding:3px 9px; border-radius:999px; cursor:pointer; border:1.5px dashed var(--ink-faint); color:var(--ink-soft); background:transparent; }
.topt-add:hover{ border-color:var(--accent); color:var(--accent-deep); }
.topt-wrap{ display:inline-flex; align-items:center; position:relative; }

function makeChipReorder(chipEl, id, container, getArr, setArr, onClick, rerender){

  const start=(e)=>{ if(e.button!==undefined&&e.button!==0)return; const pt=e.touches?e.touches[0]:e;
    cd={x:pt.clientX,y:pt.clientY,started:false,ghost:null};

    document.addEventListener('touchmove',mv,{passive:false}); document.addEventListener('touchend',up); document.addEventListener('touchcancel',up); };
  const mv=(e)=>{ if(!cd)return; const pt=e.touches?e.touches[0]:e; const dx=pt.clientX-cd.x, dy=pt.clientY-cd.y;

// shared multi-line textarea with bullet auto-continuation for entry/pool detail唠叨
function makeEntryTextarea(value, commit, cancel){
  const ta=document.createElement('textarea'); ta.className='etext-edit zh'; ta.value=value||''; ta.rows=1;
  let done=false;
  const fin=()=>{ if(done)return; done=true; commit(ta.value.replace(/\n[•·\-]\s*$/,'').replace(/\s+$/,'')); };
  ta.onkeydown=(e)=>{
    if(e.key==='Enter'&&!e.shiftKey){
      // bullet auto-continue: if current line already a bullet and empty -> exit bullet; else new bullet line
      const pos=ta.selectionStart; const before=ta.value.slice(0,pos); const after=ta.value.slice(pos);
      const curLine=before.split('\n').pop();
      if(/^[•·\-]\s*$/.test(curLine)){ // empty bullet -> finish editing
        e.preventDefault(); ta.value=ta.value.slice(0,pos-curLine.length)+after; fin(); return;
      }
      // otherwise insert a newline + bullet
      e.preventDefault();
      const ins='\n• '; ta.value=before+ins+after; ta.selectionStart=ta.selectionEnd=pos+ins.length; autoGrow(ta); return;
    }
    if(e.key==='Escape'){ done=true; cancel(); }
  };
  ta.oninput=()=>autoGrow(ta);
  ta.onblur=fin;
  return ta;
}

  let tip=document.getElementById('ring-tip'); if(!tip){ tip=document.createElement('div'); tip.id='ring-tip'; tip.className='ring-tip'; document.body.appendChild(tip); }
  const numEl=svgBox.querySelector('#ring-center-num'), labEl=svgBox.querySelector('#ring-center-lab');
  function activate(tid,clientX,clientY){ const t=tagById(tid); if(!t)return;
    svgBox.querySelectorAll('.ring-arc').forEach(a=>{ a.style.opacity=a.dataset.tid===tid?'1':'0.32'; a.style.strokeWidth=a.dataset.tid===tid?'24':'20'; });
    tip.innerHTML=`<span class="rt-dot" style="background:${t.raw}"></span>${esc(t.label)} · ${counts[tid]}`; tip.classList.add('show');
    if(clientX!=null){ tip.style.left=(clientX+14)+'px'; tip.style.top=(clientY-10)+'px'; }
  }
  function deactivate(){ svgBox.querySelectorAll('.ring-arc').forEach(a=>{ a.style.opacity='1'; a.style.strokeWidth='20'; }); tip.classList.remove('show'); }
  svgBox.querySelectorAll('.ring-arc').forEach(arc=>{
    arc.style.cursor='pointer'; arc.style.transition='opacity 0.15s, stroke-width 0.15s';
    arc.addEventListener('mouseenter',e=>activate(arc.dataset.tid,e.clientX,e.clientY));
    arc.addEventListener('mousemove',e=>{ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-10)+'px'; });
    arc.addEventListener('mouseleave',deactivate);
    arc.addEventListener('click',e=>{ e.stopPropagation(); const r=arc.getBoundingClientRect(); activate(arc.dataset.tid, e.clientX, e.clientY); }); // mobile tap
  });
  svgBox.addEventListener('click',e=>{ if(!e.target.classList.contains('ring-arc')) deactivate(); });
  // collapsible legend
  lg.innerHTML='';
  // when collapsed, vertically center the legend toggle against the ring; when expanded, top-align
  const ringwrap=lg.closest('.ringwrap'); if(ringwrap) ringwrap.classList.toggle('legend-collapsed', !ringLegendOpen);
  const toggle=document.createElement('button'); toggle.className='leg-toggle zh'+(ringLegendOpen?' open':'');
  toggle.innerHTML=`<span class="caret">▸</span> 明细（${ranked.length}）`;
  toggle.onclick=()=>{ ringLegendOpen=!ringLegendOpen; renderRing(); };
  lg.appendChild(toggle);
  if(ringLegendOpen){ const list=document.createElement('div'); list.className='leg-list';
    ranked.forEach(t=>{const it=document.createElement('div');it.className='litem';it.innerHTML=`<span class="ldot" style="background:${t.raw}"></span>${esc(t.label)}<span class="lcount">${counts[t.id]}</span>`;list.appendChild(it);});
    lg.appendChild(list); }
}
function renderRiver(){ const today=new Date(); today.setHours(0,0,0,0); const DAYS=30; const start=new Date(today); start.setDate(today.getDate()-(DAYS-1));
  const rows={m:[],n:[],e:[]};
  for(let i=0;i<DAYS;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=keyOf(d);const day=state.days[k];['m','n','e'].forEach(seg=>{const mv=day&&day.mood?day.mood[seg]:null;rows[seg].push(moodColor(mv));});}
  const box=document.getElementById('river'); box.innerHTML=''; const labels={m:'早',n:'午',e:'晚'};
  ['m','n','e'].forEach(seg=>{const row=document.createElement('div');row.className='river-row';const lab=document.createElement('div');lab.className='river-lab zh';lab.textContent=labels[seg];row.appendChild(lab);const bar=document.createElement('div');bar.className='river-bar';const stops=rows[seg].map((c,i)=>{const p=(i/(DAYS-1)*100).toFixed(1);return `${c} ${p}%`;}).join(', ');bar.style.background=`linear-gradient(90deg, ${stops})`;row.appendChild(bar);box.appendChild(row);});
  const any=Object.values(state.days).some(d=>d.mood&&(d.mood.m||d.mood.n||d.mood.e));
  document.getElementById('rivcap').textContent=any?'近 30 天 · 早午晚的心情流过':'记录早午晚心情，这里会流成一条河'; }
function switchDay(){ addingEntry=false; const bk=document.getElementById('book'); bk.classList.remove('page-flip'); void bk.offsetWidth; bk.classList.add('page-flip');
  renderHeader(); renderMood(); renderEntries(); renderDiary(); renderViews(); }
document.querySelectorAll('.vtab').forEach(tab=>{ tab.onclick=()=>{ currentView=tab.dataset.v;
  document.querySelectorAll('.vtab').forEach(t=>t.classList.toggle('on',t===tab));
  document.getElementById('v-weave').style.display=currentView==='weave'?'':'none';
  document.getElementById('v-ring').style.display=currentView==='ring'?'':'none';
  document.getElementById('v-river').style.display=currentView==='river'?'':'none'; renderViews(); }; });
document.getElementById('prev').onclick=()=>{const d=parseKey(viewDate);d.setDate(d.getDate()-1);viewDate=keyOf(d);switchDay();};
document.getElementById('next').onclick=()=>{const d=parseKey(viewDate);d.setDate(d.getDate()+1);viewDate=keyOf(d);switchDay();};
document.getElementById('djump').onclick=()=>{viewDate=todayKey();switchDay();};
document.getElementById('pool-head').onclick=(e)=>{ if(e.target.closest('.sec-line')||e.target.closest('.sec-tool'))return; togglePoolFold(); };
document.getElementById('today-tool').onclick=(e)=>{ e.stopPropagation(); enterSelectMode('today'); };
document.getElementById('pool-tool').onclick=(e)=>{ e.stopPropagation(); if(state.poolFold){state.poolFold=false;save();} enterSelectMode('pool'); };
let calMonth=null; // {y,m} currently shown month in calendar
document.getElementById('dlabel').onclick=()=>openCalendar();
function openCalendar(){
  const h=document.getElementById('pickhost'); h.innerHTML='';
  const vd=parseKey(viewDate); if(!calMonth) calMonth={y:vd.getFullYear(),m:vd.getMonth()};
  const pop=document.createElement('div'); pop.className='cal-pop';
  function draw(){
    const {y,m}=calMonth; const first=new Date(y,m,1); const startDow=(first.getDay()+6)%7; // Mon=0
    const daysInMonth=new Date(y,m+1,0).getDate();
    const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    let html=`<div class="cal-head"><span class="cal-nav" data-d="-1">‹</span><span class="cal-title">${y} 年 ${monthNames[m]}</span><span class="cal-nav" data-d="1">›</span></div>`;
    html+=`<div class="cal-grid">`;
    ['一','二','三','四','五','六','日'].forEach(w=>html+=`<div class="cal-wd">${w}</div>`);
    for(let i=0;i<startDow;i++) html+=`<div class="cal-cell empty"></div>`;
    const tk=todayKey();
    for(let d=1;d<=daysInMonth;d++){ const k=`${y}-${pad(m+1)}-${pad(d)}`;
      const has=state.days[k]&&state.days[k].entries&&state.days[k].entries.length>0;
      const isToday=k===tk; const isView=k===viewDate;
      html+=`<div class="cal-cell${isView?' view':''}${isToday?' today':''}" data-k="${k}">${d}${has?'<span class="cal-dot"></span>':''}</div>`;
    }
    html+=`</div><div class="cal-foot"><span class="cal-today-btn">↩ 回今天</span></div>`;
    pop.innerHTML=html;
    pop.querySelectorAll('.cal-nav').forEach(n=>n.onclick=()=>{ calMonth.m+=parseInt(n.dataset.d); if(calMonth.m<0){calMonth.m=11;calMonth.y--;} if(calMonth.m>11){calMonth.m=0;calMonth.y++;} draw(); });
    pop.querySelectorAll('.cal-cell[data-k]').forEach(c=>c.onclick=()=>{ viewDate=c.dataset.k; h.innerHTML=''; switchDay(); });
    pop.querySelector('.cal-today-btn').onclick=()=>{ viewDate=todayKey(); calMonth={y:new Date().getFullYear(),m:new Date().getMonth()}; h.innerHTML=''; switchDay(); };
  }
  draw(); h.appendChild(pop);
  const anchor=document.getElementById('dlabel').getBoundingClientRect();
  let top=anchor.bottom+8, left=anchor.left+anchor.width/2-140;
  if(left<12)left=12; if(left+280>window.innerWidth-12)left=window.innerWidth-292;
  pop.style.top=top+'px'; pop.style.left=left+'px';
  setTimeout(()=>{ const close=e=>{ if(!pop.contains(e.target)){h.innerHTML='';document.removeEventListener('mousedown',close);} }; document.addEventListener('mousedown',close); },0);
}
document.getElementById('export').onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='today-'+todayKey()+'.json';a.click();URL.revokeObjectURL(u);};
document.getElementById('import').onclick=async()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;const ok=await dialog({title:'导入数据？',msg:'导入会<b>覆盖</b>当前所有数据。建议先 Export 备份现在的。',ok:'导入覆盖'});if(!ok)return;const r=new FileReader();r.onload=ev=>{try{const im=JSON.parse(ev.target.result);if(!im.days){toast('文件结构不对');return;}state=migrate(im);save();switchDay();renderPool();toast('导入成功');}catch(err){toast('导入失败');}};r.readAsText(f);};inp.click();};
// ===== render gate: only render app when signed in + loaded =====
function renderAll(){ renderHeader(); renderMood(); renderEntries(); renderPool(); renderDiary(); renderViews(); }

function showSignIn(){
  document.getElementById('signin-screen').style.display='flex';
  document.getElementById('loading-screen').style.display='none';
  document.querySelector('.wrap').style.display='none';
}
function showLoading(){
  document.getElementById('signin-screen').style.display='none';
  document.getElementById('loading-screen').style.display='flex';
  document.querySelector('.wrap').style.display='none';
}
function showApp(){
  document.getElementById('signin-screen').style.display='none';
  document.getElementById('loading-screen').style.display='none';
  document.querySelector('.wrap').style.display='';
}

async function signIn(){
  const {error}=await sb.auth.signInWithOAuth({ provider:'google',
    options:{ redirectTo: window.location.href.split('#')[0].split('?')[0] } });
  if(error){ console.error(error); alert('登录失败: '+error.message); }
}
async function signOut(){ await sb.auth.signOut(); session=null; state=null; showSignIn(); }

async function loadFromCloud(){
  showLoading();
  try{
    const {data,error}=await sb.from('today_handbook').select('data').eq('user_id',session.user.id).maybeSingle();
    if(error) throw error;
    if(data&&data.data){ state=migrate(data.data); }
    else { state=fresh(); }
    showApp(); renderAll();
  }catch(e){ console.error('load failed',e); alert('加载数据失败: '+e.message); }
}

async function init(){
  const {data:{session:cur}}=await sb.auth.getSession();
  session=cur;
  sb.auth.onAuthStateChange((event,ns)=>{
    session=ns;
    if(session&&!state) loadFromCloud();
    else if(!session){ state=null; showSignIn(); }
  });
  if(session) await loadFromCloud();
  else showSignIn();
  const sbtn=document.getElementById('signin-btn'); if(sbtn) sbtn.onclick=signIn;
  const sobtn=document.getElementById('signout'); if(sobtn) sobtn.onclick=signOut;
}
window.addEventListener('resize', ()=>{ growDiary(); });
init();
</script>
